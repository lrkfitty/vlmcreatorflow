// ── DIRECTION CALCULATION ─────────────────────────────────────────────────────
// Skill sheet row order: S=0, SW=1, W=2, NW=3, N=4, NE=5, E=6, SE=7
function getDir(dx, dy) {
  const angle = (Math.atan2(-dy, dx) * 180 / Math.PI + 360) % 360;
  if (angle >= 337.5 || angle < 22.5)  return 6; // E
  if (angle < 67.5)   return 5; // NE
  if (angle < 112.5)  return 4; // N
  if (angle < 157.5)  return 3; // NW
  if (angle < 202.5)  return 2; // W
  if (angle < 247.5)  return 1; // SW
  if (angle < 292.5)  return 0; // S
  return 7; // SE
}

// ── MOVEMENT SYSTEM ───────────────────────────────────────────────────────────
let lastTime = 0;
function updateAgents(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05); // cap at 50ms
  lastTime = ts;
  const now = Date.now();

  AGENT_IDS.forEach(id => {
    const s = AS[id];
    const dx = s.tx - s.x, dy = s.ty - s.y;
    const dist = Math.hypot(dx, dy);

    // Movement
    if (dist > 2) {
      s.state = 'walking';
      s.dir = getDir(dx, dy);
      const step = Math.min(s.speed * dt, dist);
      s.x += (dx/dist) * step;
      s.y += (dy/dist) * step;
      s.fps = 9;
    } else if (s.state === 'walking') {
      s.x = s.tx; s.y = s.ty;
      s.state = 'idle';
      s.dir = 0; // face camera when arrived
      s.fps = 4;
      if (s.onArrive) { s.onArrive(); s.onArrive = null; }
    }

    // Frame animation
    s.frameTick += dt * 1000;
    const fd = 1000 / s.fps;
    if (s.frameTick >= fd) { s.frameTick -= fd; s.frame = (s.frame + 1) % 8; }

    // Bob for idle/typing
    s.bobOffset = (s.state === 'idle' || s.state === 'typing')
      ? Math.sin(ts/1000 * 1.8 + AGENT_IDS.indexOf(id)) * 1.5
      : 0;

    // Thought bubble fade
    if (s.thought) {
      s.thoughtTimer -= dt * 1000;
      if (s.thoughtTimer <= 500) s.thoughtAlpha = Math.max(0, s.thoughtTimer / 500);
      if (s.thoughtTimer <= 0) { s.thought = null; s.thoughtAlpha = 0; }
    }

    // Celebration timer
    if (s.celebTimer > 0) {
      s.celebTimer -= dt * 1000;
      s.state = 'celebrating';
    } else if (s.state === 'celebrating') {
      s.state = 'idle';
    }

    // Behavior scheduler
    if (now > s.nextBehavior && s.state !== 'walking' && !s.scenario) {
      scheduleBehavior(id);
      s.nextBehavior = now + 18000 + Math.random() * 30000;
    }
  });
}

// ── SCENARIO ENGINE ───────────────────────────────────────────────────────────
function walkTo(id, loc, onArrive) {
  const locs = getLocs();
  const dest = typeof loc === 'string' ? locs[loc] : loc;
  if (!dest) return;
  AS[id].tx = dest.x;
  AS[id].ty = dest.y;
  AS[id].onArrive = onArrive || null;
}

function walkHome(id, after) {
  walkTo(id, id, () => {
    AS[id].state = 'typing';
    AS[id].dir = 0;
    if (after) after();
  });
}

function celebrate(id, dur=2000) {
  AS[id].celebTimer = dur;
  AS[id].state = 'celebrating';
}

// ── DRAW HELPERS ──────────────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,sw=1.5) {
  cx.beginPath(); cx.roundRect(x,y,w,h,r);
  if(fill){cx.fillStyle=fill;cx.fill();}
  if(stroke){cx.strokeStyle=stroke;cx.lineWidth=sw;cx.stroke();}
}
function ln(x1,y1,x2,y2,col,w=1.5) {
  cx.strokeStyle=col; cx.lineWidth=w;
  cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();
}
function txt(s,x,y,size,col,align='left') {
  cx.fillStyle=col; cx.font=`${size}px 'Courier New'`; cx.textAlign=align; cx.fillText(s,x,y);
}
function boldTxt(s,x,y,size,col,align='left') {
  cx.fillStyle=col; cx.font=`bold ${size}px 'Courier New'`; cx.textAlign=align; cx.fillText(s,x,y);
}
function tiles(x,y,w,h,c1='#d4d0c4',c2='#c8c4b8',sz=18) {
  for(let tx=0;tx<w;tx+=sz) for(let ty=0;ty<h;ty+=sz) {
    cx.fillStyle=((tx/sz|0)+(ty/sz|0))%2?c2:c1;
    cx.fillRect(x+tx,y+ty,Math.min(sz,w-tx),Math.min(sz,h-ty));
  }
}

// ── SPRITE RENDERER ───────────────────────────────────────────────────────────
function drawSprite(id, t) {
  const s = AS[id];
  const ag = AGENT_DATA[id];
  const sp = SPRITES[id] || {};
  const bob = s.bobOffset;

  // Choose sheet
  let sheet = null, row = s.dir, cols = 8, rows = 8;
  if (s.state === 'walking' && sp.walk) {
    sheet = sp.walk; row = s.dir;
  } else if ((s.state === 'typing' || s.state === 'celebrating') && sp.typing) {
    sheet = sp.typing; row = 0; rows = 1;
  } else if (sp.idle) {
    sheet = sp.idle; row = s.state === 'walking' ? s.dir : 0;
  }

  const drawX = s.x, drawY = s.y + bob;

  if (sheet) {
    const sx = s.frame * CELL_W;
    const sy = row * CELL_H;
    cx.save();
    cx.imageSmoothingEnabled = false;
    // Celebration bounce
    const bounceY = s.state === 'celebrating' ? Math.abs(Math.sin(t * 12)) * -10 : 0;
    cx.drawImage(sheet, sx, sy, CELL_W, CELL_H, drawX - SW/2, drawY - SH + bounceY, SW, SH);
    cx.restore();
  } else {
    // Fallback: draw canvas character
    drawFallbackChar(drawX, drawY, ag, t, s.state);
  }

  // Thought bubble
  if (s.thought && s.thoughtAlpha > 0) drawThought(drawX, drawY - SH - 8, s.thought, s.thoughtAlpha);

  // EOM crown
  if (s.isEOM) drawCrown(drawX, drawY - SH - 4, t);

  // Shadow
  cx.save(); cx.globalAlpha = 0.12;

  rr(apX+apDeskW/2-14,apDeskY-20,8,18,2,'#1a1a1a');

  rr(crmX-24,crmDeskY+2,48,8,1,'#2a2838','#3a3848',1);
  deskMug(crmX-crmDeskW/2+12,crmDeskY,AGENT_DATA.crm.col);
  deskStapler(crmX+crmDeskW/2-18,crmDeskY,'#4a6a8a');

  monitor(crmX+38,crmDeskY-45,68,mh,'#2266cc',['PIPELINE','Email1: 51✓','Email2: pend','Email3: pend'],t,'#2266cc');
  [[4,80],[8,60],[5,68],[9,50],[6,72]].forEach(([v,h2],i)=>{
    cx.fillStyle='#3399ff'+['cc','aa','88','aa','cc'][i];
    cx.fillRect(x+halfW+8+i*12,WLY+wh+32,8,h2-20);
  });
}

// ── ENVIRONMENT — RECEPTION ───────────────────────────────────────────────────
function drawRecepEnv(t) {
  const x=ZX.recep, w=zw('recep'), ag=AGENT_DATA.gmail;
  const midX=x+w/2;
  const wh=(FLY-WLY)*0.25;
  window2d(x+w*0.12,WLY+14,w*0.76,wh);
  const signY=WLY+wh+20;
  cx.fillStyle='#ffd700'; cx.font=`bold 14px 'Courier New'`; cx.textAlign='center';
  cx.shadowColor='#ffd700'; cx.shadowBlur=10;
  cx.fillText('VLM HQ',midX,signY+16); cx.shadowBlur=0;
  cx.fillStyle='rgba(255,215,0,0.4)'; cx.font=`7px 'Courier New'`;
  cx.fillText('VIRAL LENSE MEDIA',midX,signY+28);
  // Reception plant
  cx.fillStyle='#2a4a1a'; cx.beginPath(); cx.arc(x+w-16,FLY-52,12,0,Math.PI*2); cx.fill();
  cx.fillStyle='#1a3a0e'; cx.fillRect(x+w-20,FLY-42,8,4);
  [[0,-12],[-8,-8],[8,-8]].forEach(([ox,oy])=>{
    cx.beginPath(); cx.ellipse(x+w-16+ox,FLY-52+oy,8,5,ox<0?-0.4:0.4,0,Math.PI*2); cx.fill();
  });
  cx.fillStyle='#8B6914'; cx.fillRect(x+w-18,FLY-38,10,38);
  const rdY=FLY-84, rdH=14;
  rr(x+4,rdY,w-8,rdH,2,'#c8912a','#a07018',1);
  rr(x+4,rdY+rdH,w-8,40,0,'#a07018');
  cx.fillStyle='#c09020'; cx.fillRect(x+6,rdY+rdH+4,w-12,2);
  monitor(midX,rdY-40,60,42,ag.col,['INBOX: OPEN','WATCHING...','keywords: ON','replies: 0'],t);
  deskMug(midX+24,rdY,ag.col);
  // EOM Board
  drawEOMBoard(x, w, t);
}

// ── EMPLOYEE OF THE MONTH BOARD ───────────────────────────────────────────────
function drawEOMBoard(recepX, recepW, t) {
  const bx = recepX + 2, by = WLY + (FLY-WLY)*0.28 + 10;
  const bw = recepW - 4, bh = (FLY-WLY)*0.38;

  // Board background
  rr(bx, by, bw, bh, 4, '#0a0808', '#ffd700', 2);
  cx.fillStyle = '#ffd70022'; cx.fillRect(bx+1, by+1, bw-2, bh*0.28);
  boldTxt('EOM', bx+bw/2, by+14, 8, '#ffd700', 'center');
  txt('EMPLOYEE', bx+bw/2, by+24, 6, 'rgba(255,215,0,0.6)', 'center');
  txt('OF MONTH',  bx+bw/2, by+33, 6, 'rgba(255,215,0,0.6)', 'center');

  // Winner sprite portrait
  const winner = eomWinner;
  const sp = SPRITES[winner];
  const ag = AGENT_DATA[winner];
  const portH = 44, portW = 36;
  const px = bx + bw/2, py = by + bh*0.55;

  if (sp && sp.base) {
    cx.save(); cx.imageSmoothingEnabled = false;
    // Gold glow behind portrait
    cx.save(); cx.globalAlpha = 0.3 + Math.sin(t*2)*0.1;
    const g = cx.createRadialGradient(px, py, 0, px, py, 40);
    g.addColorStop(0,'#ffd700'); g.addColorStop(1,'transparent');
    cx.fillStyle = g; cx.fillRect(px-40, py-50, 80, 60); cx.restore();
    // Portrait
    const baseW = sp.base.naturalWidth, baseH = sp.base.naturalHeight;
    const scale = portH / baseH;
    const dw = baseW * scale, dh = portH;
    cx.drawImage(sp.base, px-dw/2, py-dh, dw, dh);
    cx.restore();
  } else {
    // Fallback colored circle
    cx.fillStyle = ag.col;
    cx.beginPath(); cx.arc(px, py-20, 18, 0, Math.PI*2); cx.fill();
  }

  // Winner name
  cx.fillStyle = ag.col; cx.font = `bold 7px 'Courier New'`; cx.textAlign = 'center';
  cx.fillText(ag.label, px, py+8);

  // Score
  const score = {
    outreach: live.emails_sent*2+(live.leads_total||0), autoposter: (live.queued_posts||0)*1.5,
    crm: live.leads_total||0, gmail: 40, claude: 100, gemini: (live.images||9)*5, kling: (live.videos||2)*15
  }[winner]|0;
  txt(`${score} pts`, px, py+18, 6, 'rgba(255,215,0,0.7)', 'center');

  // Spinning star decoration
  cx.save(); cx.translate(bx+10, by+10); cx.rotate(t*0.8);
  cx.fillStyle = '#ffd700'; cx.font = '10px sans-serif'; cx.textAlign='center';
  cx.fillText('★', 0, 4); cx.restore();
  cx.save(); cx.translate(bx+bw-10, by+10); cx.rotate(-t*0.8);
  cx.fillStyle = '#ffd700'; cx.textAlign='center';
  cx.fillText('★', 0, 4); cx.restore();
}

// ── BREAK AREA ────────────────────────────────────────────────────────────────
function drawBreakArea(t) {
  const bx = W*0.42, by = FLY - 50;
  // Coffee machine
  rr(bx, by, 22, 44, 3, '#2a2828', '#444', 1.5);
  rr(bx+3, by+4, 16, 10, 2, '#050505');
  // Screen
  cx.fillStyle = '#00eeff44'; cx.fillRect(bx+4, by+5, 14, 8);
  txt('☕', bx+5, by+14, 9, '#00eeff');
  // Cup output
  rr(bx+6, by+28, 10, 12, 2, '#c8912a', '#a07018', 1);
  // Drip light
  cx.save(); cx.globalAlpha=0.12+Math.sin(t*3)*0.05;
  const g2=cx.createRadialGradient(bx+11,by+20,0,bx+11,by+20,30);
  g2.addColorStop(0,'#00eeff'); g2.addColorStop(1,'transparent');
  cx.fillStyle=g2; cx.fillRect(bx-10,by,42,50); cx.restore();
  // Small table
  rr(bx+26, by+28, 30, 5, 1, '#c8912a', '#a07018', 1);
  cx.fillStyle='#a07018'; cx.fillRect(bx+28,by+33,6,FLY-by-33); cx.fillRect(bx+44,by+33,6,FLY-by-33);
}

// ── AGENT LABELS ──────────────────────────────────────────────────────────────
function agentLabel(id, t) {
  const s = AS[id];
  const ag = AGENT_DATA[id];
  const lx = s.x, ly = s.y + 8;
  const lw = 100;
  rr(lx-lw/2, ly, lw, 22, 4, '#0d1020', ag.col, 1.5);
  // Status dot
  const isActive = ['ACTIVE','SYNCING','WATCHING'].includes(ag.status);
  cx.save(); cx.globalAlpha = isActive ? 0.9 : 0.4;
  cx.beginPath(); cx.arc(lx-lw/2+9, ly+11, 3.5, 0, Math.PI*2);
  cx.fillStyle = isActive ? '#00ff88' : '#555'; cx.fill(); cx.restore();
  // Mini pixel avatar
  cx.save(); cx.imageSmoothingEnabled = false;
  const sp = SPRITES[id];
  if (sp && sp.base) {
    const scale = 18 / sp.base.naturalHeight;
    const dw = sp.base.naturalWidth * scale;
    cx.drawImage(sp.base, lx-lw/2+15, ly+2, dw, 18);
  } else {
    const ps=2, spx=lx-lw/2+16, spy=ly+4;
    cx.fillStyle=ag.hair||'#111'; cx.fillRect(spx+ps,spy,4*ps,ps);
    cx.fillStyle=ag.skin||'#c8a070'; cx.fillRect(spx+ps,spy+ps,4*ps,3*ps);
    cx.fillStyle='#222'; cx.fillRect(spx+ps,spy+2*ps,ps,ps); cx.fillRect(spx+4*ps,spy+2*ps,ps,ps);
    cx.fillStyle=ag.shirt||'#2a2a4a'; cx.fillRect(spx,spy+4*ps,6*ps,3*ps);
  }
  cx.restore();
  cx.fillStyle = ag.col; cx.font = `bold 8px 'Courier New'`; cx.textAlign = 'center';
  cx.fillText(ag.label, lx+8, ly+16);
  // EOM indicator
  if (s.isEOM) {
    cx.fillStyle='#ffd700'; cx.font=`8px 'Courier New'`; cx.textAlign='center';
    cx.fillText('★ EOM', lx+8, ly+26);
  }
}

// ── TITLE BAR ─────────────────────────────────────────────────────────────────
function titleBar(t) {
  cx.fillStyle='#0d1020'; cx.fillRect(0,0,W,TH);
  cx.fillStyle='#ffd700'; cx.fillRect(0,TH-2,W,2);
  cx.fillStyle='#ffd700'; cx.font=`bold 20px 'Courier New'`; cx.textAlign='left';
  cx.shadowColor='#ffd700'; cx.shadowBlur=14; cx.fillText('VLM HQ',18,34); cx.shadowBlur=0;
  cx.fillStyle='rgba(255,215,0,0.35)'; cx.font=`9px 'Courier New'`;
  cx.fillText('AGENT OPERATIONS — LIVE VIEW',18,46);
  const zones=[['EXECUTIVE','#ffd700'],['CREATIVE','#cc00ff'],['SALES','#00ff88'],['OPS','#3399ff'],['RECEPTION','#ff3333']];
  let lx=W*0.28; cx.font=`9px 'Courier New'`;
  zones.forEach(([name,col])=>{
    cx.beginPath(); cx.arc(lx+5,32,5,0,Math.PI*2); cx.fillStyle=col; cx.fill();
    cx.fillStyle='rgba(255,255,255,0.65)'; cx.textAlign='left'; cx.fillText(name,lx+14,36);
    lx+=name.length*6+28;
  });
  // Skills badge
  const bx=W-310;
  rr(bx,19,130,14,3,'rgba(0,255,136,0.08)','rgba(0,255,136,0.25)',1);
  cx.fillStyle='rgba(0,255,136,0.55)'; cx.font=`7px 'Courier New'`; cx.textAlign='left';
  cx.fillText('SKILLS: CHAR-SPRITE · DESK-ACCESSORY',bx+5,29);
  // Live dot
  const ba=0.5+Math.sin(t*2.5)*0.5;
  cx.save(); cx.globalAlpha=ba;
  cx.beginPath(); cx.arc(W-86,32,4,0,Math.PI*2); cx.fillStyle='#00ff88'; cx.fill(); cx.restore();
  cx.fillStyle='rgba(255,255,255,0.4)'; cx.font=`9px 'Courier New'`; cx.textAlign='right';
  cx.fillText('LIVE · '+new Date().toLocaleTimeString(),W-14,36);
}

// ── BOTTOM BAR ────────────────────────────────────────────────────────────────
let tickerX=W;
function bottomBar(t) {
  const by=H-BH;
  cx.fillStyle='#0d1020'; cx.fillRect(0,by,W,BH);
  cx.fillStyle='rgba(255,215,0,0.5)'; cx.fillRect(0,by,W,2);
  const mets=[
    {l:'LEADS',v:live.leads_total??51,col:'#00ff88'},
    {l:'EMAILS',v:live.emails_sent??50,col:'#ffd700'},
    {l:'POST QUEUE',v:live.queued_posts??58,col:'#ff00cc'},
    {l:'IMAGES',v:live.images??9,col:'#00eeff'},
    {l:'VIDEOS',v:live.videos??2,col:'#ff4400'},
    {l:'AGENTS LIVE',v:4,col:'#3399ff'},
  ];
  const mw=W/mets.length;
  mets.forEach((m,i)=>{
    const mx=i*mw+mw/2;
    cx.fillStyle=m.col; cx.font=`bold 28px 'Courier New'`; cx.textAlign='center';
    cx.shadowColor=m.col; cx.shadowBlur=10; cx.fillText(m.v,mx,by+42); cx.shadowBlur=0;
    cx.fillStyle='rgba(255,255,255,0.3)'; cx.font=`8px 'Courier New'`; cx.fillText(m.l,mx,by+56);
    if(i>0){cx.strokeStyle='rgba(255,255,255,0.07)';cx.lineWidth=1;
      cx.beginPath();cx.moveTo(i*mw,by+10);cx.lineTo(i*mw,by+70);cx.stroke();}
  });
  const ty=by+68;
  cx.fillStyle='#060c18'; cx.fillRect(0,ty,W,BH-68);
  cx.fillStyle='#0d1a10'; cx.fillRect(0,ty,W,18);
  cx.save(); cx.beginPath(); cx.rect(0,ty,W,18); cx.clip();
  const acts=live.activity||[];
  const tickStr=acts.length ? acts.map(a=>`${a.agent||'SYS'} — ${(a.action||'').slice(0,40)}`).join('   •   ') : 'SYSTEM IDLE — All agents on standby';
  cx.fillStyle='#00ccff'; cx.font=`8px 'Courier New'`; cx.textAlign='left';
  cx.fillText(tickStr,tickerX,ty+13);
  const tw=cx.measureText(tickStr).width;
  tickerX-=1.2; if(tickerX<-tw) tickerX=W;
  cx.restore();
  cx.fillStyle='#00ccff44'; cx.fillRect(0,ty,60,18);
  cx.fillStyle='#00ccff'; cx.font=`bold 7px 'Courier New'`; cx.textAlign='left';
  cx.fillText('◄ ACTIVITY',4,ty+13);
}

// ── CLICK HANDLING ────────────────────────────────────────────────────────────
const hitBoxes=[];
let selected=null;
cv.addEventListener('click', e => {
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  for(const hb of hitBoxes){
    if(mx>=hb.x&&mx<=hb.x+hb.w&&my>=hb.y&&my<=hb.y+hb.h){ showPanel(AGENT_DATA[hb.id]); return; }
  }
  closePanel();
});
function showPanel(ag) {
  selected=ag;
  const p=document.getElementById('panel');
  p.style.display='block'; p.style.borderTopColor=ag.col;
  document.getElementById('pn').style.color=ag.col;
  document.getElementById('pn').textContent=ag.label;
  document.getElementById('pr').textContent=ag.role;
  document.getElementById('ps2').innerHTML=ag.stats.map(([k,v])=>`<div class="ps"><span>${k}</span><span>${v}</span></div>`).join('');
}
window.closePanel=()=>{ selected=null; document.getElementById('panel').style.display='none'; };

// Zone hit boxes for click
function registerHitBoxes() {
  hitBoxes.length=0;
  const hw=20;
  AGENT_IDS.forEach(id => {
    const s=AS[id];
    hitBoxes.push({id, x:s.x-hw, y:s.y-SH, w:hw*2, h:SH+20});
  });
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function frame(ts) {
  const t=ts/1000;
  updateAgents(ts);
  checkStandup(Date.now());

  hitBoxes.length=0;
  cx.clearRect(0,0,W,H);

  // Environment
  ZW.forEach(([id,col])=>zoneBG(id,col));
  drawExecEnv(t);
  drawCreativeEnv(t);
  drawSalesEnv(t);
  drawOpsEnv(t);
  drawRecepEnv(t);
  drawBreakArea(t);

  // All agent sprites
  AGENT_IDS.forEach(id => {
    drawSprite(id, t);
    agentLabel(id, t);
    const s=AS[id];
    hitBoxes.push({id, x:s.x-14, y:s.y-SH, w:28, h:SH+28});
  });

  // Selected outline
  if(selected) {
    const id=Object.keys(AGENT_DATA).find(k=>AGENT_DATA[k]===selected);
    const s=AS[id];
    if(s){ cx.strokeStyle=selected.col; cx.lineWidth=2.5; cx.strokeRect(s.x-20,s.y-SH-4,40,SH+32); }
  }

  titleBar(t);
  bottomBar(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

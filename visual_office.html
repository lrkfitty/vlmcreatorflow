<!DOCTYPE html>
<html lang="en">
<head>

<title>VLM HQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1c1008;overflow:hidden;font-family:'Courier New',monospace;}
canvas{display:block;}
#panel{position:fixed;top:58px;right:20px;background:rgba(8,10,20,.95);border:1px solid #333;
  border-radius:10px;padding:20px 22px;width:270px;display:none;z-index:100;
  font-family:'Courier New',monospace;box-shadow:0 12px 40px rgba(0,0,0,.7);}
#panel h2{font-size:12px;letter-spacing:3px;margin-bottom:2px;}
#panel .rl{font-size:9px;color:#555;margin-bottom:12px;}

<body>
<canvas id="c"></canvas>
<div id="panel">
  <h2 id="pn">AGENT</h2><div class="rl" id="pr">Role</div>
  <div id="ps2"></div>
  <div id="pcls" onclick="closePanel()">[ CLOSE ]</div>
</div>
<script>
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=cv.width=window.innerWidth, H=cv.height=window.innerHeight;
var TH_BAR=50, BOT_BAR=80;

// ── ISO CONSTANTS ─────────────────────────────────────────────────────────────
var TW=68, TH_T=34, WH=46;
var OX=W*0.50, OY=H*0.20;
function iso(c,r){ return {x:OX+(c-r)*TW/2, y:OY+(c+r)*TH_T/2}; }

// ── CAMERA (pan + zoom) ───────────────────────────────────────────────────────
var cam={x:0,y:0,z:1,drag:false,lx:0,ly:0};
(function(){
  cv.addEventListener('mousedown',function(e){
    if(e.button===0){cam.drag=true;cam.lx=e.clientX;cam.ly=e.clientY;}
  });
  window.addEventListener('mouseup',function(){cam.drag=false;});
  window.addEventListener('mousemove',function(e){
    if(!cam.drag) return;
    cam.x+=e.clientX-cam.lx; cam.y+=e.clientY-cam.ly;
    cam.lx=e.clientX; cam.ly=e.clientY;
  });
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    var dz=e.deltaY>0?0.92:1.09;
    var cx=e.clientX, cy=e.clientY;
    cam.x=(cam.x-cx)*dz+cx; cam.y=(cam.y-cy)*dz+cy;
    cam.z=Math.max(0.4,Math.min(2.2,cam.z*dz));
  },{passive:false});
})();

// ── LIVE DATA ─────────────────────────────────────────────────────────────────
var live={leads_total:51,emails_sent:0,queued_posts:28,activity:[]};
function fetchLive(){fetch('http://localhost:5001/api/status').then(function(r){return r.json();}).then(function(d){live=d;}).catch(function(){});}
fetchLive(); setInterval(fetchLive,15000);

// ── AGENTS ────────────────────────────────────────────────────────────────────
// zb = zone bounds for constrained walking {minC,maxC,minR,maxR}
var AGENTS={
  claude:    {label:'CLAUDE CODE', role:'Orchestrator — Executive',     col:'#ffd700',c:3,  r:3,  status:'ACTIVE',  zb:{minC:1,maxC:4,minR:1,maxR:5},
    stats:[['STATUS','ACTIVE — Automode ON'],['TASKS','8 completed'],['STACK','Python · Node · ffmpeg'],['QUEUE','0 pending']]},
  gemini:    {label:'GEMINI',      role:'Image Gen — Creative Studio',  col:'#00eeff',c:2,  r:10, status:'IDLE',    zb:{minC:1,maxC:4,minR:7,maxR:12},
    stats:[['STATUS','IDLE'],['IMAGES','9 × 4K generated'],['MODEL','Flash 3.1 Image'],['SAFETY','1 filtered']]},
  kling:     {label:'KLING AI',    role:'Cinematographer — Creative',   col:'#cc00ff',c:5,  r:13, status:'IDLE',    zb:{minC:4,maxC:7,minR:10,maxR:14},
    stats:[['STATUS','IDLE'],['CLIPS','6 × 5s rendered'],['MODEL','kling-v2-6 pro'],['MODE','image2video']]},
  outreach:  {label:'OUTREACH BOT',role:'Sales Rep — Sales Floor',      col:'#00ff88',c:9,  r:8,  status:'ACTIVE',  zb:{minC:6,maxC:12,minR:4,maxR:11},
    stats:[['STATUS','ACTIVE'],['LEADS','51 contacted'],['EMAIL 2','Fires Mar 29'],['VERTICALS','3']]},
  autoposter:{label:'AUTO-POSTER', role:'Social Media Mgr — Ops',      col:'#ff00cc',c:14, r:6,  status:'ACTIVE',  zb:{minC:12,maxC:17,minR:3,maxR:8},
    stats:[['STATUS','ACTIVE'],['ACCOUNTS','Neo / Shay / Ty'],['QUEUE','58 posts'],['SCHEDULE','10:00+22:00 BKK']]},
  crm:       {label:'CRM SYNC',    role:'Data Analyst — Ops Center',   col:'#3399ff',c:17, r:4,  status:'SYNCING', zb:{minC:15,maxC:20,minR:2,maxR:7},
    stats:[['STATUS','SYNCING'],['LEADS','51 tracked'],['SYNC','Every hour'],['PLATFORM','flowleads']]},
  gmail:     {label:'GMAIL MON.',  role:'Receptionist — Front Desk',   col:'#ff3333',c:18, r:13, status:'WATCHING', zb:{minC:15,maxC:21,minR:10,maxR:15},
    stats:[['STATUS','WATCHING'],['INBOX','hello@vlmcreateflow.com'],['TRIGGER','Booking KW'],['REPLIES','0 detected']]},
};

// ── SPRITE SHEET SPECS ────────────────────────────────────────────────────────
// Typing: 8 cols x 1 row, cell = 656x800
// Idle/Walk: 8 cols x 8 rows, cell = 232x288
// Row order: S=0,SW=1,W=2,NW=3,N=4,NE=5,E=6,SE=7
var CW_T=656, CH_T=800;   // typing cell
var CW_I=232, CH_I=288;   // idle/walk cell

var typeSp={}, idleSp={}, walkSp={}, frontSp={};
// GIF-based animated sprites (loaded as <img> so browser animates them)
var idleGif={}, walkGif={};

function chromaKey(img){
  var off=document.createElement('canvas');
  off.width=img.naturalWidth; off.height=img.naturalHeight;
  var oc=off.getContext('2d'); oc.drawImage(img,0,0);
  var id=oc.getImageData(0,0,off.width,off.height), d=id.data;
  for(var i=0;i<d.length;i+=4){if(d[i]>190&&d[i+1]<90&&d[i+2]>190) d[i+3]=0;}
  oc.putImageData(id,0,0); return off;
}

function loadImg(src, cb){
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){cb(img);}; img.src=src;
}

function loadGif(src, store, id){
  // Load GIF as live <img> — canvas drawImage picks up current animated frame
  var img=new Image();
  img.onload=function(){store[id]=img;};
  img.src=src;
}

var IDS=['claude','gemini','kling','outreach','autoposter','crm','gmail'];
IDS.forEach(function(id){
  loadImg('http://localhost:5001/sprites/'+id+'_front_idle.png', function(img){frontSp[id]=chromaKey(img);});
  loadImg('http://localhost:5001/sprites/'+id+'_typing_sheet.png', function(img){typeSp[id]=img;});
  loadImg('http://localhost:5001/sprites/'+id+'_idle_sheet.png', function(img){idleSp[id]=img;});
  loadImg('http://localhost:5001/sprites/'+id+'_walk_sheet.png', function(img){walkSp[id]=img;});
  // New AI-generated GIF animations
  loadGif('http://localhost:5001/sprites/'+id+'_idle_anim.gif', idleGif, id);
  loadGif('http://localhost:5001/sprites/'+id+'_walk_anim.gif', walkGif, id);
});

// ── STATE MACHINE ─────────────────────────────────────────────────────────────
var ST={};

function initST(id, t){
  var ag=AGENTS[id], isAct=['ACTIVE','SYNCING','WATCHING'].indexOf(ag.status)>=0;
  var seed=IDS.indexOf(id)*3.7;
  ST[id]={
    state: isAct?'typing':'idle',
    timer: t+seed+Math.random()*8,
    fromC: ag.c, fromR: ag.r,
    toC:   ag.c, toR:   ag.r,
    wStart:0, wDur:3,
    curC: ag.c, curR: ag.r,
    goingHome: false,
  };
}
IDS.forEach(function(id){initST(id,0);});

function pickTarget(id){
  var ag=AGENTS[id], z=ag.zb;
  var c=Math.round(z.minC+Math.random()*(z.maxC-z.minC));
  var r=Math.round(z.minR+Math.random()*(z.maxR-z.minR));
  return {c:c, r:r};
}

function walkDir(dc, dr){
  // Returns row 0-7: S=0,SW=1,W=2,NW=3,N=4,NE=5,E=6,SE=7
  if(Math.abs(dc)<0.01&&Math.abs(dr)<0.01) return 0;
  var deg=((Math.atan2(dr,dc)*180/Math.PI)+360)%360;
  if(deg<22.5||deg>=337.5) return 6;
  if(deg<67.5)  return 7;
  if(deg<112.5) return 0;
  if(deg<157.5) return 1;
  if(deg<202.5) return 2;
  if(deg<247.5) return 3;
  if(deg<292.5) return 4;
  return 5;
}

function updateST(id, t){
  var ag=AGENTS[id], s=ST[id];
  var isAct=['ACTIVE','SYNCING','WATCHING'].indexOf(ag.status)>=0;

  if(s.state==='walking'){
    var prog=Math.min((t-s.wStart)/s.wDur,1);
    s.curC=s.fromC+(s.toC-s.fromC)*prog;
    s.curR=s.fromR+(s.toR-s.fromR)*prog;
    if(prog>=1){
      s.curC=s.toC; s.curR=s.toR;
      if(s.goingHome){
        // Arrived home — back to work
        s.state=isAct?'typing':'idle';
        s.timer=t+Math.random()*12+8;
        s.goingHome=false;
      } else {
        // At destination — wait, then go home
        s.state='idle';
        s.timer=t+Math.random()*4+2;
      }
    }
  } else if(t>=s.timer){
    var roll=Math.random();
    if(s.state==='typing'){
      if(roll<0.55){
        // Short idle break
        s.state='idle'; s.timer=t+Math.random()*5+3;
      } else {
        // Walk somewhere
        var tgt=pickTarget(id);
        s.fromC=s.curC; s.fromR=s.curR;
        s.toC=tgt.c; s.toR=tgt.r;
        s.wStart=t; s.wDur=Math.max(1.0,Math.hypot(tgt.c-s.curC,tgt.r-s.curR)*0.4);
        s.state='walking'; s.goingHome=false;
      }
    } else if(s.state==='idle'){
      // Walk back to desk
      var home=AGENTS[id];
      s.fromC=s.curC; s.fromR=s.curR;
      s.toC=home.c; s.toR=home.r;
      s.wStart=t; s.wDur=Math.max(1.0,Math.hypot(home.c-s.curC,home.r-s.curR)*0.4);
      s.state='walking'; s.goingHome=true;
    }
  }
  return s;
}

// ── DRAW HELPERS ─────────────────────────────────────────────────────────────
function ft(s,x,y,sz,col,al){ctx.fillStyle=col;ctx.font=(sz||9)+'px "Courier New"';ctx.textAlign=al||'left';ctx.fillText(s,x,y);}
function bt(s,x,y,sz,col,al){ctx.fillStyle=col;ctx.font='bold '+(sz||9)+'px "Courier New"';ctx.textAlign=al||'left';ctx.fillText(s,x,y);}

function drawFloor(c,r,fill,stroke){
  var p=iso(c,r);
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+TW/2,p.y+TH_T/2);ctx.lineTo(p.x,p.y+TH_T);ctx.lineTo(p.x-TW/2,p.y+TH_T/2);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=0.5;ctx.stroke();}
}

function wallR(c,r,h,fill){
  var p=iso(c,r),ph=h*WH;
  ctx.beginPath();ctx.moveTo(p.x,p.y+TH_T);ctx.lineTo(p.x+TW/2,p.y+TH_T/2);ctx.lineTo(p.x+TW/2,p.y+TH_T/2-ph);ctx.lineTo(p.x,p.y+TH_T-ph);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=0.5;ctx.stroke();
}

function wallL(c,r,h,fill){
  var p=iso(c,r),ph=h*WH;
  ctx.beginPath();ctx.moveTo(p.x-TW/2,p.y+TH_T/2);ctx.lineTo(p.x,p.y+TH_T);ctx.lineTo(p.x,p.y+TH_T-ph);ctx.lineTo(p.x-TW/2,p.y+TH_T/2-ph);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.10)';ctx.lineWidth=0.5;ctx.stroke();
}

function drawBox(c,r,wc,dr2,h,topF,rtF,ltF){
  var ph=h*WH;
  var p0=iso(c,r),p1=iso(c+wc,r),p2=iso(c+wc,r+dr2),p3=iso(c,r+dr2);
  // right face
  ctx.beginPath();ctx.moveTo(p1.x,p1.y+TH_T/2);ctx.lineTo(p2.x,p2.y+TH_T/2);ctx.lineTo(p2.x,p2.y+TH_T/2-ph);ctx.lineTo(p1.x,p1.y+TH_T/2-ph);ctx.closePath();
  ctx.fillStyle=rtF||'#906810';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=0.5;ctx.stroke();
  // left face
  ctx.beginPath();ctx.moveTo(p2.x,p2.y+TH_T/2);ctx.lineTo(p3.x,p3.y+TH_T/2);ctx.lineTo(p3.x,p3.y+TH_T/2-ph);ctx.lineTo(p2.x,p2.y+TH_T/2-ph);ctx.closePath();
  ctx.fillStyle=ltF||'#a87820';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=0.5;ctx.stroke();
  // top face
  ctx.beginPath();ctx.moveTo(p0.x,p0.y+TH_T/2);ctx.lineTo(p1.x,p1.y+TH_T/2);ctx.lineTo(p2.x,p2.y+TH_T/2);ctx.lineTo(p3.x,p3.y+TH_T/2);ctx.closePath();
  ctx.fillStyle=topF||'#c09030';ctx.fill();ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=0.5;ctx.stroke();
}

function monitor3d(c,r,col,lines,t){
  var p=iso(c,r);
  var sx=p.x, sy=p.y+TH_T/2-1*WH;
  var mw=TW*0.55, mh=mw*0.7;
  ctx.fillStyle='#111';ctx.fillRect(sx-mw/2,sy-mh,mw,mh);
  ctx.fillStyle='#040810';ctx.fillRect(sx-mw/2+2,sy-mh+2,mw-4,mh-4);
  ctx.save();ctx.globalAlpha=0.15+Math.sin(t*2)*0.05;ctx.fillStyle=col;ctx.fillRect(sx-mw/2+2,sy-mh+2,mw-4,mh-4);ctx.restore();
  ctx.fillStyle=col+'66';ctx.fillRect(sx-mw/2+2,sy-mh+2,mw-4,10);
  ctx.save();ctx.beginPath();ctx.rect(sx-mw/2+2,sy-mh+2,mw-4,mh-4);ctx.clip();
  (lines||[]).forEach(function(l,i){
    ctx.fillStyle=i===0?col:'rgba(255,255,255,.7)';
    ctx.font=(i===0?'bold ':'')+6+'px "Courier New"';ctx.textAlign='left';ctx.fillText(l,sx-mw/2+4,sy-mh+10+i*9);
  });
  ctx.restore();
  ctx.fillStyle='#222';ctx.fillRect(sx-1,sy-2,2,6);ctx.fillRect(sx-5,sy+4,10,2);
  ctx.save();ctx.globalAlpha=0.07+Math.sin(t*1.5)*0.02;
  var g=ctx.createRadialGradient(sx,sy-mh/2,0,sx,sy-mh/2,mw);
  g.addColorStop(0,col);g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(sx-mw*1.5,sy-mh*1.8,mw*3,mh*2.5);ctx.restore();
}

// ── CHARACTER WITH ANIMATED SPRITE SHEETS ─────────────────────────────────────
function drawChar(id,t){
  var ag=AGENTS[id], s=updateST(id,t);
  var p=iso(s.curC,s.curR);
  var fx=p.x, fy=p.y+TH_T;
  var isAct=['ACTIVE','SYNCING','WATCHING'].indexOf(ag.status)>=0;

  // Glow
  if(isAct){
    ctx.save();ctx.globalAlpha=0.14+Math.sin(t*2.5)*0.06;
    var rg=ctx.createRadialGradient(fx,fy-H*0.08,0,fx,fy-H*0.08,H*0.1);
    rg.addColorStop(0,ag.col);rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(fx-H*0.12,fy-H*0.19,H*0.24,H*0.20);ctx.restore();
  }

  var sprH=H*0.10, bob=0;

  if(s.state==='walking'&&walkGif[id]){
    // Use AI-generated walk/wave GIF
    sprH=H*0.10; bob=Math.sin(t*10)*2;
    var sw=walkGif[id].naturalWidth||128, sh=walkGif[id].naturalHeight||128;
    var sprW=sprH*(sw/sh);
    ctx.drawImage(walkGif[id],fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else if(s.state==='walking'&&walkSp[id]){
    var wf=Math.floor((t*7)%8);
    var dc=s.toC-s.fromC, dr=s.toR-s.fromR;
    var dir=walkDir(dc,dr);
    sprH=H*0.10; bob=Math.sin(t*12)*2.5;
    var sprW=sprH*(CW_I/CH_I);
    ctx.drawImage(walkSp[id],wf*CW_I,dir*CH_I,CW_I,CH_I,fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else if(s.state==='typing'&&typeSp[id]){
    var tf=Math.floor((t*6)%8);
    sprH=H*0.08; bob=Math.sin(t*8)*1.2;
    var sprW=sprH*(CW_T/CH_T);
    ctx.drawImage(typeSp[id],tf*CW_T,0,CW_T,CH_T,fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else if(idleGif[id]){
    // Use AI-generated idle GIF — browser handles animation
    sprH=H*0.10; bob=Math.sin(t*1.8)*1.5;
    var sw2=idleGif[id].naturalWidth||128, sh2=idleGif[id].naturalHeight||128;
    var sprW=sprH*(sw2/sh2);
    ctx.drawImage(idleGif[id],fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else if(idleSp[id]){
    var inf=Math.floor((t*4)%8);
    sprH=H*0.10; bob=Math.sin(t*1.8)*1.5;
    var sprW=sprH*(CW_I/CH_I);
    ctx.drawImage(idleSp[id],inf*CW_I,0,CW_I,CH_I,fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else if(frontSp[id]){
    sprH=H*0.11; bob=Math.sin(t*1.8)*1.5;
    var sprW=sprH*(frontSp[id].width/frontSp[id].height);
    ctx.drawImage(frontSp[id],0,0,frontSp[id].width,frontSp[id].height,fx-sprW/2,fy-sprH+bob,sprW,sprH);
  } else { return; }

  // Name badge
  var bw=96,bh=17,bx=fx-bw/2,by=fy+4;
  ctx.save();ctx.globalAlpha=0.82;ctx.fillStyle='#080a14';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.fill();ctx.restore();
  ctx.strokeStyle=ag.col;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,3);ctx.stroke();
  ctx.save();ctx.globalAlpha=isAct?1:0.35;ctx.beginPath();ctx.arc(bx+9,by+8,3,0,Math.PI*2);ctx.fillStyle=isAct?'#00ff88':'#444';ctx.fill();ctx.restore();
  var hbW=sprH*0.85;
  bt(ag.label,fx,by+12,7,ag.col,'center');
  hitBoxes.push({id:id,x:fx-hbW/2-5,y:fy-sprH,w:hbW+10,h:sprH+bh+6});
}

// ── SCENE ────────────────────────────────────────────────────────────────────
function drawScene(t){
  var maxC=22, maxR=16;
  function zc(c,r){
    if(c<=5&&r<=6) return {f:'#e8dfc4',s:'#d8cdb0',a:'#ffd700'};
    if(c<=7&&r>=6) return {f:'#e2d8ee',s:'#cfc4de',a:'#cc00ff'};
    if(c>=12&&r<=10) return {f:'#d0dff0',s:'#beccd8',a:'#3399ff'};
    if(c>=14&&r>=10) return {f:'#f0e8c8',s:'#ddd4b0',a:'#ff3333'};
    return {f:'#d8edd8',s:'#c4d8c4',a:'#00ff88'};
  }

  // Back wall + left wall — draw as unified panels, minimal dividers
  for(var c=0;c<maxC;c++){
    var isWin=(c>=1&&c<=4)||(c>=6&&c<=9)||(c>=11&&c<=15)||(c>=17&&c<=20);
    wallR(c,0,3,isWin?'rgba(160,210,240,0.18)':'#f0ece0');
    // Only draw vertical frame at window edges (not every tile)
    var prevWin=(c>0)&&((c-1>=1&&c-1<=4)||(c-1>=6&&c-1<=9)||(c-1>=11&&c-1<=15)||(c-1>=17&&c-1<=20));
    if(isWin&&!prevWin){
      var wp=iso(c,0),ph=3*WH;
      ctx.strokeStyle='rgba(180,170,150,0.35)';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(wp.x,wp.y+TH_T/2);ctx.lineTo(wp.x+TW/2,wp.y+TH_T/2-ph);ctx.stroke();
    }
    // Horizontal sill on windows
    if(isWin){
      var wp2=iso(c,0);
      ctx.strokeStyle='rgba(200,190,160,0.25)';ctx.lineWidth=0.6;
      ctx.beginPath();ctx.moveTo(wp2.x,wp2.y+TH_T/2-1.2*WH);ctx.lineTo(wp2.x+TW/2,wp2.y+TH_T/2-1.2*WH-TH_T/2);ctx.stroke();
    }
  }
  for(var r=0;r<maxR;r++) wallL(0,r,3,'#eae6da');

  // Ceiling lights
  [3,9,15,19].forEach(function(c){
    var lp=iso(c,1);
    ctx.save();ctx.globalAlpha=0.20;
    var lg=ctx.createRadialGradient(lp.x,lp.y+TH_T/2-3*WH,0,lp.x,lp.y+TH_T/2-3*WH,TW*1.6);
    lg.addColorStop(0,'#fffae0');lg.addColorStop(1,'transparent');
    ctx.fillStyle=lg;ctx.fillRect(lp.x-TW*2,lp.y-3*WH-20,TW*4,3*WH+30);ctx.restore();
    ctx.fillStyle='#ccc8b0';ctx.fillRect(lp.x-TW*0.4,lp.y+TH_T/2-3*WH-4,TW*0.8,6);
    ctx.fillStyle='#fffde8';ctx.fillRect(lp.x-TW*0.3,lp.y+TH_T/2-3*WH-2,TW*0.6,3);
  });

  // Floor
  for(var band=0;band<=maxC+maxR;band++){
    for(var ci=0;ci<=band;ci++){
      var ri=band-ci;
      if(ci>=maxC||ri>=maxR||ci<0||ri<0) continue;
      var z=zc(ci,ri);
      drawFloor(ci,ri,((ci+ri)%2===0)?z.f:z.s,'rgba(0,0,0,.08)');
    }
  }

  // Glass partitions
  for(var ci2=0;ci2<=6;ci2++){
    var pa=iso(ci2,6);
    ctx.strokeStyle='rgba(180,210,240,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pa.x+TW/2,pa.y+TH_T/2);ctx.lineTo(pa.x+TW/2,pa.y+TH_T/2-2*WH);ctx.stroke();
  }
  for(var ri2=2;ri2<=12;ri2++){
    var pa2=iso(12,ri2);
    ctx.strokeStyle='rgba(180,210,240,0.45)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pa2.x,pa2.y+TH_T/2);ctx.lineTo(pa2.x,pa2.y+TH_T/2-2*WH);ctx.stroke();
  }

  // ── EXECUTIVE ────────────────────────────────────────────────────────────────
  for(var ri3=1;ri3<=5;ri3++){
    var gp=iso(5,ri3);
    ctx.save();ctx.globalAlpha=0.12;ctx.fillStyle='#88aacc';
    ctx.beginPath();ctx.moveTo(gp.x,gp.y+TH_T/2);ctx.lineTo(gp.x,gp.y+TH_T);ctx.lineTo(gp.x,gp.y+TH_T-2*WH);ctx.lineTo(gp.x,gp.y+TH_T/2-2*WH);ctx.closePath();ctx.fill();ctx.restore();
    ctx.strokeStyle='rgba(140,180,220,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(gp.x,gp.y+TH_T/2);ctx.lineTo(gp.x,gp.y+TH_T/2-2*WH);ctx.stroke();
  }
  drawBox(0,1,1,1,2,'#8B5E1A','#6a4510','#7a5218');
  ['#8B0000','#006400','#00008B','#8B4513','#4B0082'].forEach(function(bc,i){
    var bp=iso(0,1);ctx.fillStyle=bc;ctx.fillRect(bp.x+TW/2+i*4-2,bp.y+TH_T/2-2*WH+4+i*4,3,2*WH-8-i*4);
  });
  drawBox(1,2,3,1,1,'#c09030','#906810','#a87820');
  drawBox(1,2,1,2,1,'#c09030','#906810','#a87820');
  monitor3d(2,2,'#ffd700',['> AUTOMODE: ON','> TASKS: 8','> QUEUE: 0'],t);
  monitor3d(3,2,'#ffaa00',['DIRECTIVE LOG','outreach.py v','render.py v'],t);
  monitor3d(1,3,'#ff8800',['SYSTEM OK','crons: 4','all green v'],t);
  drawChar('claude',t);

  // ── CREATIVE ─────────────────────────────────────────────────────────────────
  var bbp=iso(0,8);
  ctx.fillStyle='#8B6914';ctx.fillRect(bbp.x,bbp.y+TH_T/2-2.5*WH,5,1.2*WH);
  ctx.fillStyle='#c8a050';ctx.fillRect(bbp.x+1,bbp.y+TH_T/2-2.4*WH,3,1*WH);
  drawBox(1,9,2,2,1,'#b87a1a','#8a5a10','#9a6818');
  var dtp=iso(2,9);
  ctx.fillStyle='#0a0a1a';ctx.fillRect(dtp.x-TW*0.35,dtp.y+TH_T/2-1.2*WH,TW*0.7,TH_T*0.9);
  ['#ff6b6b','#ffd700','#00eeff','#cc00ff'].forEach(function(col,i){
    ctx.save();ctx.globalAlpha=0.6;ctx.fillStyle=col;
    ctx.fillRect(dtp.x-TW*0.32+i*TW*0.17,dtp.y+TH_T/2-1.15*WH,TW*0.15,TH_T*0.4);ctx.restore();
  });
  ctx.save();ctx.globalAlpha=0.12+Math.sin(t*1.8)*0.05;ctx.fillStyle='#00eeff';ctx.fillRect(dtp.x-TW*0.35,dtp.y+TH_T/2-1.2*WH,TW*0.7,TH_T*0.9);ctx.restore();
  drawChar('gemini',t);
  // Kling's tripod
  var kp=iso(5,12);
  ctx.strokeStyle='#555';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(kp.x,kp.y+TH_T/2-2.2*WH);ctx.lineTo(kp.x-TW*0.4,kp.y+TH_T/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kp.x,kp.y+TH_T/2-2.2*WH);ctx.lineTo(kp.x+TW*0.4,kp.y+TH_T/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(kp.x,kp.y+TH_T/2-2.2*WH);ctx.lineTo(kp.x,kp.y+TH_T/2);ctx.stroke();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(kp.x,kp.y+TH_T/2-2.4*WH,TW*0.28,TH_T*0.35,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#003344';ctx.beginPath();ctx.arc(kp.x-TW*0.1,kp.y+TH_T/2-2.4*WH,TW*0.09,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f5f5f5';ctx.fillRect(kp.x+TW*0.5,kp.y+TH_T/2-2.0*WH,TW*0.35,TH_T*0.8);
  ctx.fillStyle='#111';ctx.fillRect(kp.x+TW*0.5,kp.y+TH_T/2-2.0*WH,TW*0.35,TH_T*0.25);
  ft('VLM',kp.x+TW*0.52,kp.y+TH_T/2-1.85*WH,6,'#00ff88');
  drawChar('kling',t);

  // ── SALES ─────────────────────────────────────────────────────────────────
  var sbp=iso(7,0),sbW=TW*1.8,sbH=2.2*WH;
  ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle='#020f04';ctx.fillRect(sbp.x+TW/2,sbp.y+TH_T/2-3*WH,sbW,sbH);ctx.restore();
  ctx.strokeStyle='#00ff44';ctx.lineWidth=1.5;ctx.strokeRect(sbp.x+TW/2,sbp.y+TH_T/2-3*WH,sbW,sbH);
  ctx.save();ctx.globalAlpha=0.07;for(var sy=0;sy<sbH;sy+=4) ctx.fillRect(sbp.x+TW/2,sbp.y+TH_T/2-3*WH+sy,sbW,2);ctx.restore();
  ctx.fillStyle='#00ff44';ctx.font='bold '+Math.floor(sbH*0.45)+'px "Courier New"';ctx.textAlign='center';
  ctx.shadowColor='#00ff44';ctx.shadowBlur=18;ctx.fillText(live.leads_total||51,sbp.x+TW/2+sbW/2,sbp.y+TH_T/2-3*WH+sbH*0.62);ctx.shadowBlur=0;
  ctx.font='bold '+Math.floor(sbH*0.13)+'px "Courier New"';ctx.fillStyle='rgba(0,255,68,.65)';
  ctx.fillText('LEADS IN PIPELINE',sbp.x+TW/2+sbW/2,sbp.y+TH_T/2-3*WH+sbH*0.22);
  ctx.font=Math.floor(sbH*0.1)+'px "Courier New"';ctx.fillStyle='rgba(0,255,68,.35)';
  ctx.fillText('Financial - Coaches - Agency',sbp.x+TW/2+sbW/2,sbp.y+TH_T/2-3*WH+sbH*0.88);
  var wbp=iso(9,0),wbW=TW*1.2,wbH=1.8*WH;
  ctx.fillStyle='#f8f9ff';ctx.fillRect(wbp.x+TW/2,wbp.y+TH_T/2-3*WH+8,wbW,wbH);
  ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.strokeRect(wbp.x+TW/2,wbp.y+TH_T/2-3*WH+8,wbW,wbH);
  ctx.fillStyle='#1a6b3a';ctx.font='bold 7px "Courier New"';ctx.textAlign='left';
  ctx.fillText('EMAIL 2: MAR 29',wbp.x+TW/2+4,wbp.y+TH_T/2-3*WH+22);
  ['v 51 CONTACTED','3 VERTICALS','FINANCIAL: 20','COACHES: 20','AGENCY: 11'].forEach(function(l,i){
    ctx.fillStyle=l[0]==='v'?'#006633':'#444';ctx.font='6px "Courier New"';
    ctx.fillText(l,wbp.x+TW/2+4,wbp.y+TH_T/2-3*WH+32+i*11);
  });
  drawBox(8,6,2,2,1,'#c09030','#906810','#a87820');
  monitor3d(9,7,'#00ff88',['OUTREACH BOT','51 LEADS','EMAIL 2: MAR29'],t);
  drawChar('outreach',t);

  // ── OPS ───────────────────────────────────────────────────────────────────
  drawBox(13,4,3,2,1,'#c09030','#906810','#a87820');
  monitor3d(13,4,'#ff00cc',['@neoismyname1','Queue:16','LIVE v'],t);
  monitor3d(14,4,'#ff55cc',['@shay.so.fine','Queue:24','LIVE v'],t);
  monitor3d(15,4,'#cc0088',['@tytheguyyttg','Queue:18','LIVE v'],t);
  drawChar('autoposter',t);
  drawBox(16,3,3,2,1,'#c09030','#906810','#a87820');
  monitor3d(16,3,'#3399ff',['CRM SYNC','51 tracked','Sync: hrly'],t);
  monitor3d(17,3,'#2266cc',['PIPELINE','51 sent v','0 replies'],t);
  drawChar('crm',t);

  // ── RECEPTION ────────────────────────────────────────────────────────────
  var sgp=iso(21,11);
  ctx.fillStyle='#ffd700';ctx.font='bold 16px "Courier New"';ctx.textAlign='center';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=12;ctx.fillText('VLM HQ',sgp.x+TW/2,sgp.y+TH_T/2-2.2*WH);ctx.shadowBlur=0;
  ft('VIRAL LENSE MEDIA',sgp.x+TW/2,sgp.y+TH_T/2-1.8*WH,6,'rgba(255,215,0,.35)','center');
  drawBox(17,11,2,2,1,'#c09030','#906810','#a87820');
  drawBox(17,13,3,1,1,'#c09030','#906810','#a87820');
  monitor3d(18,12,'#ff3333',['INBOX: OPEN','WATCHING...','replies: 0'],t);
  var pp=iso(21,14);
  ctx.fillStyle='#5a3810';ctx.fillRect(pp.x-4,pp.y+TH_T/2-WH*0.6,8,WH*0.6);
  [[-6,-14],[0,-20],[8,-14],[-10,-8],[10,-8]].forEach(function(off){
    ctx.fillStyle='#2a5a1a';ctx.beginPath();ctx.ellipse(pp.x+off[0],pp.y+TH_T/2+off[1],8,6,off[0]<0?-0.4:0.4,0,Math.PI*2);ctx.fill();
  });
  drawChar('gmail',t);
}

// ── UI BARS ──────────────────────────────────────────────────────────────────
var tickX=W;
function titleBar(t){
  ctx.save();ctx.globalAlpha=0.92;ctx.fillStyle='#07090f';ctx.fillRect(0,0,W,TH_BAR);ctx.restore();
  ctx.fillStyle='rgba(255,215,0,.5)';ctx.fillRect(0,TH_BAR-1,W,1);
  ctx.fillStyle='#ffd700';ctx.font='bold 18px "Courier New"';ctx.textAlign='left';
  ctx.shadowColor='#ffd700';ctx.shadowBlur=10;ctx.fillText('VLM HQ',16,31);ctx.shadowBlur=0;
  ft('AGENT OPERATIONS',16,43,8,'rgba(255,215,0,.3)');
  var leg=[['EXEC','#ffd700'],['CREATIVE','#cc00ff'],['SALES','#00ff88'],['OPS','#3399ff'],['RECEP','#ff3333']];
  var lx=W*0.22;
  leg.forEach(function(z){
    ctx.beginPath();ctx.arc(lx+4,28,4,0,Math.PI*2);ctx.fillStyle=z[1];ctx.fill();
    ft(z[0],lx+12,32,8,'rgba(255,255,255,.55)');lx+=z[0].length*5.2+24;
  });
  ctx.save();ctx.globalAlpha=0.5+Math.sin(t*2.5)*0.5;
  ctx.beginPath();ctx.arc(W-88,28,4,0,Math.PI*2);ctx.fillStyle='#00ff88';ctx.fill();ctx.restore();
  ft('LIVE - '+new Date().toLocaleTimeString(),W-12,32,8,'rgba(255,255,255,.35)','right');
}

function bottomBar(t){
  var by=H-BOT_BAR;
  ctx.save();ctx.globalAlpha=0.92;ctx.fillStyle='#07090f';ctx.fillRect(0,by,W,BOT_BAR);ctx.restore();
  ctx.fillStyle='rgba(255,215,0,.4)';ctx.fillRect(0,by,W,1);
  var mets=[
    {l:'LEADS',v:live.leads_total||51,col:'#00ff88'},
    {l:'EMAILS SENT',v:live.emails_sent||0,col:'#ffd700'},
    {l:'POST QUEUE',v:live.queued_posts||28,col:'#ff00cc'},
    {l:'IMAGES GEN',v:9,col:'#00eeff'},
    {l:'VIDEOS',v:6,col:'#cc00ff'},
    {l:'AGENTS LIVE',v:4,col:'#3399ff'},
  ];
  var mw=W/mets.length;
  mets.forEach(function(m,i){
    var mx=i*mw+mw/2;
    ctx.fillStyle=m.col;ctx.font='bold 22px "Courier New"';ctx.textAlign='center';
    ctx.shadowColor=m.col;ctx.shadowBlur=6;ctx.fillText(m.v,mx,by+34);ctx.shadowBlur=0;
    ft(m.l,mx,by+48,7,'rgba(255,255,255,.28)','center');
    if(i>0){ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(i*mw,by+8);ctx.lineTo(i*mw,by+60);ctx.stroke();}
  });
  var ty=by+60;
  ctx.save();ctx.globalAlpha=0.95;ctx.fillStyle='#040810';ctx.fillRect(0,ty,W,BOT_BAR-60);ctx.restore();
  ctx.fillStyle='rgba(0,204,255,.2)';ctx.fillRect(0,ty,W,1);
  ctx.save();ctx.beginPath();ctx.rect(0,ty,W,BOT_BAR-60);ctx.clip();
  var acts=live.activity||[];
  var ts2=acts.length?acts.map(function(a){return(a.agent||'SYS')+' - '+(a.action||'').slice(0,42);}).join('   o   '):'ALL AGENTS STANDING BY';
  ctx.fillStyle='#00ccff';ctx.font='8px "Courier New"';ctx.textAlign='left';ctx.fillText(ts2,tickX,ty+13);
  tickX-=1.4;if(tickX<-ctx.measureText(ts2).width) tickX=W;
  ctx.restore();
  ctx.save();ctx.globalAlpha=0.9;ctx.fillStyle='#040810';ctx.fillRect(0,ty,65,BOT_BAR-60);ctx.restore();
  bt('FEED',5,ty+13,7,'#00ccff44');
}

// ── CLICK ───────────────────────────────────────────────────────────────────
var hitBoxes=[], selected=null;
cv.addEventListener('click',function(e){
  if(Math.abs(e.clientX-cam.lx)>4||Math.abs(e.clientY-cam.ly)>4) return; // was a drag
  var r=cv.getBoundingClientRect();
  // Unproject camera transform
  var mx=(e.clientX-r.left-cam.x)/cam.z;
  var my=(e.clientY-r.top-cam.y)/cam.z;
  for(var i=0;i<hitBoxes.length;i++){
    var h=hitBoxes[i];
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){showPanel(AGENTS[h.id]);return;}
  }
  closePanel();
});
function showPanel(ag){
  selected=ag;
  var p=document.getElementById('panel');p.style.display='block';p.style.borderColor=ag.col+'88';
  var pn=document.getElementById('pn');pn.style.color=ag.col;pn.textContent=ag.label;
  document.getElementById('pr').textContent=ag.role;
  document.getElementById('ps2').innerHTML=ag.stats.map(function(s){
    return '<div class="ps"><span style="color:#555">'+s[0]+'</span><span style="color:'+ag.col+'">'+s[1]+'</span></div>';
  }).join('');
}
window.closePanel=function(){selected=null;document.getElementById('panel').style.display='none';};

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
function frame(ts){
  var t=ts/1000;
  hitBoxes.length=0;
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#b8d8f0');bg.addColorStop(0.4,'#d4e8f8');bg.addColorStop(1,'#e8f0f8');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Apply camera transform to scene only
  ctx.save();
  ctx.translate(cam.x, cam.y);
  ctx.scale(cam.z, cam.z);
  drawScene(t);
  if(selected){
    var sid=null;
    Object.keys(AGENTS).forEach(function(k){if(AGENTS[k]===selected) sid=k;});
    if(sid){
      var shb=null;
      hitBoxes.forEach(function(h){if(h.id===sid) shb=h;});
      if(shb){ctx.save();ctx.globalAlpha=0.4+Math.sin(t*3)*0.15;ctx.strokeStyle=selected.col;ctx.lineWidth=2;ctx.strokeRect(shb.x,shb.y,shb.w,shb.h);ctx.restore();}
    }
  }
  ctx.restore();

  titleBar(t);bottomBar(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
